<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Practical Kit Shop{% endblock %}</title><meta name="description" content="Practical spreadsheets, checklists, and calculators for work and everyday operations.">
<style>
:root{--ink:#15212b;--muted:#66727c;--paper:#f7f5ef;--card:#fff;--accent:#e5673d;--navy:#143d52;--line:#d9dedf}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif;line-height:1.55}a{color:inherit}.wrap{max-width:1120px;margin:auto;padding:0 24px}nav{background:var(--navy);color:#fff}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:1.15rem;font-weight:800;text-decoration:none;letter-spacing:.02em}.links{display:flex;gap:24px}.links a{text-decoration:none}.hero{padding:86px 0 64px;background:linear-gradient(135deg,#143d52,#1d5c69);color:#fff}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.75rem;font-weight:800;color:#f0a37d}.hero h1{font-family:Georgia,serif;font-size:clamp(2.7rem,6vw,5.2rem);line-height:.98;max-width:800px;margin:14px 0 24px}.hero p{font-size:1.15rem;max-width:620px;color:#d7e5e8}.btn{display:inline-block;border:0;border-radius:6px;padding:13px 20px;background:var(--accent);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}.btn.alt{background:#fff;color:var(--navy);margin-left:8px}.section{padding:60px 0}.section h2{font-family:Georgia,serif;font-size:2.25rem;margin:0 0 8px}.lede{color:var(--muted);margin:0 0 30px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);padding:23px;border-radius:10px;box-shadow:0 4px 18px #1231}.card h3{margin:6px 0 8px;font-size:1.05rem}.tag{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:800}.price{font-size:1.3rem;font-weight:850;margin-top:16px}.card a{text-decoration:none}.filters{display:flex;flex-wrap:wrap;gap:9px;margin:22px 0}.pill{border:1px solid var(--line);border-radius:99px;padding:7px 13px;text-decoration:none;background:#fff}.pill.active{background:var(--navy);color:#fff}.product{display:grid;grid-template-columns:1.2fr .8fr;gap:46px}.preview{background:#e8eeeb;min-height:430px;border-radius:12px;padding:50px;display:grid;place-items:center}.sheet{background:white;width:240px;height:320px;padding:22px;box-shadow:0 10px 28px #1234}.lines{height:8px;background:#dbe4e5;margin:13px 0}.feature{padding:11px 0;border-bottom:1px solid var(--line)}label{font-weight:700}input,select{width:100%;padding:10px;margin:5px 0 14px;border:1px solid #aab4b7;border-radius:5px}.calculator{max-width:720px}.result{background:#e7f1ed;border-left:5px solid #2c7a66;padding:18px;margin-top:16px;font-size:1.2rem;font-weight:800}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}footer{background:#102c3a;color:#d5e0e3;padding:40px 0;margin-top:50px}@media(max-width:700px){.links{gap:12px;font-size:.88rem}.product{grid-template-columns:1fr}.hero{padding:60px 0}.btn.alt{margin:10px 0 0}}
</style>{% block head %}{% endblock %}</head><body><nav><div class="wrap nav"><a class="brand" href="/">PRACTICAL KIT SHOP</a><div class="links"><a href="/products">Shop</a><a href="/tools">Free tools</a></div></div></nav>{% block content %}{% endblock %}<footer><div class="wrap"><strong>Practical Kit Shop</strong><p>Useful downloads. Clear prices. Instant access.</p><small>Templates provide general organizational information and are not legal, tax, financial, or medical advice. USD pricing.</small></div></footer></body></html>
